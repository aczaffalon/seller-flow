<section class="dashboard">
  <header class="dashboard__header">
    <h1>{{ pageTitle }}</h1>
    <p>{{ pageDescription }}</p>
  </header>

  <div class="dashboard__indicators">
    @for (indicator of indicators; track indicator.label) {
  <app-indicator-card
    [label]="indicator.label"
    [value]="indicator.value"
  />
}
  </div>

  <div class="dashboard__actions">
    <button type="button" (click)="toggleWelcomeMessage()">
      Mostrar/ocultar mensagem
    </button>

    @if (showWelcomeMessage()) {
      <p>Bem-vindo ao SellerFlow!</p>
    }

    <button
      type="button"
      [disabled]="isActionDisabled()"
    >
      Ação principal
    </button>

    <button
      type="button"
      (click)="toggleActionState()"
    >
      Alternar estado da ação
    </button>
  </div>
</section>
