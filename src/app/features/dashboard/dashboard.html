<section class="dashboard">
  <header class="dashboard__header">
    <h1>{{ pageTitle }}</h1>
    <p>{{ pageDescription }}</p>
  </header>

  <div class="dashboard__indicators">
 @for (indicator of indicators; track indicator.label) {
  <app-indicator-card
    [label]="indicator.label"
    [value]="indicator.value"
    (selected)="handleIndicatorSelected(indicator.label)"
  />
   }
  </div>

  @if (selectedIndicator()) {
   <p>Indicador selecionado: {{ selectedIndicator() }}</p>
  }
</section>
